<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple, private to-do list for your day.">
    <title>Everyday — To-do list</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <header>
        <p class="eyebrow">Everyday / Your personal to-do list</p>
        <h1>One thing at a time.</h1>
        <p class="intro">A little space for everything you want to get done.</p>
      </header>

      <section class="task-panel" aria-labelledby="list-heading">
        <h2 id="list-heading">My tasks</h2>
        <form id="task-form">
          <label for="task-input">What needs doing?</label>
          <div class="input-row">
            <input
              id="task-input"
              name="task"
              type="text"
              placeholder="e.g. Read a chapter"
              maxlength="200"
              autocomplete="off"
              required
            >
            <button class="add-button" type="submit">Add task</button>
          </div>
        </form>

        <div class="list-summary">
          <p id="task-count" role="status">0 tasks left</p>
          <button id="clear-completed" class="text-button" type="button" disabled>
            Clear completed
          </button>
        </div>
        <ul id="task-list" aria-label="Tasks"></ul>
        <p id="empty-state">A fresh start. Add your first task above.</p>
      </section>

      <p class="storage-note">Your list stays in this browser. No account needed.</p>
      <p id="storage-status" role="status" hidden></p>
      <noscript>Please enable JavaScript to add and manage your tasks.</noscript>
    </main>
  </body>
</html>
